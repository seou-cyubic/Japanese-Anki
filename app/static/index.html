<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한자 덱 수정</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="side" aria-label="한자 탐색과 구조 편집">
    <div class="side-block search-block">
      <label class="sr-only" for="q">한자 검색</label>
      <input id="q" type="search" placeholder="한자 · 훈음 · 읽기 · 용례로 찾기" autocomplete="off">
      <div id="search-status" class="sr-only" aria-live="polite"></div>
      <div id="hits" class="hits" role="listbox" aria-label="검색 결과"></div>
    </div>

    <div class="side-block grow">
      <div class="side-title">
        <span>슬롯</span>
        <span id="slot-count" class="muted"></span>
      </div>
      <div id="slots" class="slots"></div>
    </div>

    <div class="side-block editor-block">
      <div class="side-title">
        <span>편집</span>
        <span id="editor-scope" class="muted"></span>
      </div>
      <div id="editor" class="editor"></div>
    </div>

    <div class="side-block anki-block">
      <div class="side-title">
        <span>Anki</span>
        <span id="anki-scope" class="muted"></span>
      </div>
      <div id="anki" class="anki"></div>
    </div>

    <div class="side-block log-block">
      <div class="side-title">
        <span>변경 로그</span>
        <span id="log-scope" class="muted">전체</span>
      </div>
      <div id="log" class="log"></div>
      <div class="contract-note" title="JIS·획수·빈도·근거 필드는 현 데이터에 없어 표시하지 않는다">
        CURRENT SCHEMA · LEGACY METADATA 미생성
      </div>
    </div>
  </aside>

  <main>
    <div id="status" class="status" hidden role="status"></div>
    <div id="decks" class="decks" aria-label="덱 선택"></div>
    <div id="modes" class="modes" aria-label="카드 표시 모드"></div>
    <div id="meta" class="meta"></div>
    <div id="card" class="card">
      <div class="empty">왼쪽에서 한자를 찾아 누른다.</div>
    </div>
    <div id="errors" class="errors" hidden role="alert"></div>
  </main>

  <div class="savebar" id="savebar" hidden>
    <span id="dirty" class="dirty" aria-live="polite"></span>
    <label class="sr-only" for="reason">저장 사유</label>
    <input id="reason" type="text" maxlength="500"
      placeholder="무엇을 왜 고쳤는가 — 사유 없이는 저장하지 않는다">
    <button id="revert" class="ghost" type="button">되돌리기</button>
    <button id="save" class="primary" type="button">저장</button>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <div id="modal-text"></div>
      <div class="modal-buttons">
        <button id="m-save" class="primary" type="button">저장하고 이동</button>
        <button id="m-drop" class="ghost" type="button">버리고 이동</button>
        <button id="m-cancel" class="ghost" type="button">취소</button>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
